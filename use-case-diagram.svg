<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #16202a; }
      .boundary-title { font: 700 24px Arial, sans-serif; fill: #16202a; }
      .actor-label { font: 700 19px Arial, sans-serif; fill: #16202a; text-anchor: middle; }
      .usecase-label { font: 16px Arial, sans-serif; fill: #16202a; text-anchor: middle; }
      .small { font: 14px Arial, sans-serif; fill: #34414d; text-anchor: middle; }
      .boundary { fill: #f8fbfd; stroke: #263746; stroke-width: 3; }
      .usecase { fill: #e8f3fb; stroke: #1f5f85; stroke-width: 2.5; }
      .actor { stroke: #16202a; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .association { stroke: #42515e; stroke-width: 2; fill: none; }
      .include { stroke: #60717d; stroke-width: 1.8; fill: none; stroke-dasharray: 8 6; }
      .include-label { font: italic 13px Arial, sans-serif; fill: #52616b; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60717d"/>
    </marker>
  </defs>

  <rect width="1800" height="1320" fill="white"/>
  <text x="900" y="48" class="title" text-anchor="middle">Use Case Diagram</text>
  <text x="900" y="80" class="small">Web-Based Project Management Hub for Optimized Extension Training Services at ISU-Cauayan</text>

  <!-- System boundary -->
  <rect x="300" y="110" width="1200" height="1110" rx="8" class="boundary"/>
  <text x="900" y="151" class="boundary-title" text-anchor="middle">Web-Based Project Management Hub</text>

  <!-- Use cases -->
  <g id="use-cases">
    <ellipse cx="590" cy="225" rx="190" ry="42" class="usecase"/>
    <text x="590" y="219" class="usecase-label"><tspan x="590">Authenticate User</tspan><tspan x="590" dy="21">and Apply Role Permissions</tspan></text>

    <ellipse cx="900" cy="225" rx="185" ry="42" class="usecase"/>
    <text x="900" y="219" class="usecase-label"><tspan x="900">View Role-Based</tspan><tspan x="900" dy="21">Dashboard</tspan></text>

    <ellipse cx="1210" cy="225" rx="190" ry="42" class="usecase"/>
    <text x="1210" y="219" class="usecase-label"><tspan x="1210">Manage Users, Roles</tspan><tspan x="1210" dy="21">and Permissions</tspan></text>

    <ellipse cx="520" cy="390" rx="190" ry="42" class="usecase"/>
    <text x="520" y="384" class="usecase-label"><tspan x="520">Manage Programs, Projects</tspan><tspan x="520" dy="21">and Project Components</tspan></text>

    <ellipse cx="900" cy="390" rx="160" ry="42" class="usecase"/>
    <text x="900" y="384" class="usecase-label"><tspan x="900">Manage</tspan><tspan x="900" dy="21">Extensionists</tspan></text>

    <ellipse cx="1270" cy="390" rx="175" ry="42" class="usecase"/>
    <text x="1270" y="384" class="usecase-label"><tspan x="1270">Monitor Project Status</tspan><tspan x="1270" dy="21">and Activities</tspan></text>

    <ellipse cx="520" cy="565" rx="180" ry="42" class="usecase"/>
    <text x="520" y="559" class="usecase-label"><tspan x="520">Submit and Revise</tspan><tspan x="520" dy="21">Project Proposals</tspan></text>

    <ellipse cx="900" cy="565" rx="180" ry="42" class="usecase"/>
    <text x="900" y="559" class="usecase-label"><tspan x="900">Review and Route</tspan><tspan x="900" dy="21">Proposals</tspan></text>

    <ellipse cx="1270" cy="565" rx="185" ry="42" class="usecase"/>
    <text x="1270" y="559" class="usecase-label"><tspan x="1270">Manage Documents</tspan><tspan x="1270" dy="21">and Supporting Files</tspan></text>

    <ellipse cx="520" cy="740" rx="190" ry="42" class="usecase"/>
    <text x="520" y="734" class="usecase-label"><tspan x="520">Submit Accomplishment</tspan><tspan x="520" dy="21">Reports and Updates</tspan></text>

    <ellipse cx="900" cy="740" rx="180" ry="42" class="usecase"/>
    <text x="900" y="734" class="usecase-label"><tspan x="900">Generate Reports</tspan><tspan x="900" dy="21">and Analytics</tspan></text>

    <ellipse cx="1270" cy="740" rx="175" ry="42" class="usecase"/>
    <text x="1270" y="734" class="usecase-label"><tspan x="1270">Generate</tspan><tspan x="1270" dy="21">Certificates</tspan></text>

    <ellipse cx="710" cy="930" rx="190" ry="42" class="usecase"/>
    <text x="710" y="924" class="usecase-label"><tspan x="710">Record Monitoring and</tspan><tspan x="710" dy="21">Evaluation Information</tspan></text>

    <ellipse cx="1110" cy="930" rx="190" ry="42" class="usecase"/>
    <text x="1110" y="924" class="usecase-label"><tspan x="1110">Receive Notifications</tspan><tspan x="1110" dy="21">and Status Updates</tspan></text>

    <ellipse cx="900" cy="1090" rx="190" ry="42" class="usecase"/>
    <text x="900" y="1084" class="usecase-label"><tspan x="900">Record Audit Logs and</tspan><tspan x="900" dy="21">Maintain Project History</tspan></text>
  </g>

  <!-- Actors -->
  <g id="actors">
    <!-- System Administrator -->
    <g transform="translate(150,250)" class="actor">
      <circle cx="0" cy="0" r="18"/>
      <path d="M0 18 L0 82 M-34 42 L34 42 M0 82 L-28 125 M0 82 L28 125"/>
    </g>
    <text x="150" y="405" class="actor-label">System</text><text x="150" y="428" class="actor-label">Administrator</text>

    <!-- ETS Personnel -->
    <g transform="translate(150,650)" class="actor">
      <circle cx="0" cy="0" r="18"/>
      <path d="M0 18 L0 82 M-34 42 L34 42 M0 82 L-28 125 M0 82 L28 125"/>
    </g>
    <text x="150" y="805" class="actor-label">ETS Personnel</text>

    <!-- Program Leader -->
    <g transform="translate(1650,250)" class="actor">
      <circle cx="0" cy="0" r="18"/>
      <path d="M0 18 L0 82 M-34 42 L34 42 M0 82 L-28 125 M0 82 L28 125"/>
    </g>
    <text x="1650" y="405" class="actor-label">Program Leader</text>

    <!-- Project Leader -->
    <g transform="translate(1650,520)" class="actor">
      <circle cx="0" cy="0" r="18"/>
      <path d="M0 18 L0 82 M-34 42 L34 42 M0 82 L-28 125 M0 82 L28 125"/>
    </g>
    <text x="1650" y="675" class="actor-label">Project Leader</text>

    <!-- Faculty Extensionist -->
    <g transform="translate(1650,790)" class="actor">
      <circle cx="0" cy="0" r="18"/>
      <path d="M0 18 L0 82 M-34 42 L34 42 M0 82 L-28 125 M0 82 L28 125"/>
    </g>
    <text x="1650" y="945" class="actor-label">Faculty</text><text x="1650" y="968" class="actor-label">Extensionist</text>

    <!-- University Administration -->
    <g transform="translate(150,1010)" class="actor">
      <circle cx="0" cy="0" r="18"/>
      <path d="M0 18 L0 82 M-34 42 L34 42 M0 82 L-28 125 M0 82 L28 125"/>
    </g>
    <text x="150" y="1165" class="actor-label">University</text><text x="150" y="1188" class="actor-label">Administration</text>
  </g>

  <!-- Associations: System Administrator -->
  <g class="association">
    <path d="M170 290 L400 240"/><path d="M170 300 L340 380"/><path d="M170 310 L390 545"/>
    <path d="M170 320 L400 735"/><path d="M170 330 L700 920"/><path d="M170 340 L1020 930"/>
    <path d="M170 350 L1030 1090"/><path d="M170 280 L1020 225"/>
  </g>

  <!-- Associations: ETS Personnel -->
  <g class="association">
    <path d="M170 650 L350 410"/><path d="M170 660 L740 390"/><path d="M170 670 L710 550"/>
    <path d="M170 680 L710 740"/><path d="M170 690 L1090 565"/><path d="M170 700 L1090 740"/>
    <path d="M170 710 L1090 930"/><path d="M170 720 L1090 1090"/><path d="M170 640 L1090 390"/>
  </g>

  <!-- Associations: Program Leader -->
  <g class="association">
    <path d="M1630 290 L1080 240"/><path d="M1630 300 L1450 390"/><path d="M1630 310 L1460 560"/>
    <path d="M1630 320 L1460 740"/><path d="M1630 330 L1300 930"/>
  </g>

  <!-- Associations: Project Leader -->
  <g class="association">
    <path d="M1630 560 L700 565"/><path d="M1630 570 L1450 565"/><path d="M1630 580 L1450 740"/>
    <path d="M1630 590 L900 930"/><path d="M1630 600 L1060 1090"/>
  </g>

  <!-- Associations: Faculty Extensionist -->
  <g class="association">
    <path d="M1630 830 L700 565"/><path d="M1630 840 L1450 565"/><path d="M1630 850 L700 740"/>
    <path d="M1630 860 L1300 740"/><path d="M1630 870 L1300 930"/><path d="M1630 880 L1060 1090"/>
  </g>

  <!-- Associations: University Administration -->
  <g class="association">
    <path d="M170 1010 L710 930"/><path d="M170 1020 L900 740"/><path d="M170 1030 L900 1090"/>
  </g>

  <!-- Included behavior -->
  <g class="include" marker-end="url(#arrow)">
    <path d="M590 267 C590 310 590 325 520 348"/>
    <path d="M700 565 C760 600 790 625 820 680"/>
    <path d="M1080 565 C1040 600 1010 625 980 680"/>
    <path d="M1090 930 C1030 970 990 1005 950 1048"/>
  </g>
  <text x="535" y="316" class="include-label">&lt;&lt;include&gt;&gt;</text>
  <text x="750" y="630" class="include-label">&lt;&lt;include&gt;&gt;</text>
  <text x="1040" y="630" class="include-label">&lt;&lt;include&gt;&gt;</text>
  <text x="1015" y="987" class="include-label">&lt;&lt;include&gt;&gt;</text>

  <text x="900" y="1282" class="small">Figure 5. Use Case Diagram of the Web-Based Project Management Hub</text>
</svg>
