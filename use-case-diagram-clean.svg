<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <style>
      .title{font:700 29px Arial,sans-serif;fill:#17212b}.subtitle{font:15px Arial,sans-serif;fill:#51606b}
      .boundary{fill:#fbfdff;stroke:#263746;stroke-width:3}.boundaryTitle{font:700 23px Arial,sans-serif;fill:#17212b}
      .case{fill:#eaf4fb;stroke:#286389;stroke-width:2.2}.caseText{font:16px Arial,sans-serif;fill:#17212b;text-anchor:middle}
      .line{fill:none;stroke:#64727d;stroke-width:1.8}.actor{fill:none;stroke:#17212b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .actorText{font:700 17px Arial,sans-serif;fill:#17212b;text-anchor:middle}.note{font:italic 13px Arial,sans-serif;fill:#64727d}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="white"/>
  <text x="800" y="42" class="title" text-anchor="middle">Use Case Diagram</text>
  <text x="800" y="70" class="subtitle" text-anchor="middle">Web-Based Project Management Hub for Optimized Extension Training Services at ISU-Cauayan</text>
  <rect x="300" y="100" width="1000" height="920" rx="8" class="boundary"/>
  <text x="800" y="140" class="boundaryTitle" text-anchor="middle">Web-Based Project Management Hub</text>

  <ellipse cx="800" cy="195" rx="175" ry="36" class="case"/><text x="800" y="190" class="caseText"><tspan x="800">Authenticate User</tspan><tspan x="800" dy="20">and Apply Role Permissions</tspan></text>
  <ellipse cx="800" cy="285" rx="175" ry="36" class="case"/><text x="800" y="280" class="caseText"><tspan x="800">View Role-Based</tspan><tspan x="800" dy="20">Dashboard</tspan></text>

  <ellipse cx="540" cy="400" rx="185" ry="38" class="case"/><text x="540" y="394" class="caseText"><tspan x="540">Manage Programs, Projects</tspan><tspan x="540" dy="20">and Components</tspan></text>
  <ellipse cx="800" cy="400" rx="150" ry="38" class="case"/><text x="800" y="394" class="caseText"><tspan x="800">Manage</tspan><tspan x="800" dy="20">Extensionists</tspan></text>
  <ellipse cx="1060" cy="400" rx="175" ry="38" class="case"/><text x="1060" y="394" class="caseText"><tspan x="1060">Manage Users, Roles</tspan><tspan x="1060" dy="20">and Permissions</tspan></text>

  <ellipse cx="540" cy="555" rx="175" ry="38" class="case"/><text x="540" y="549" class="caseText"><tspan x="540">Submit and Revise</tspan><tspan x="540" dy="20">Project Proposals</tspan></text>
  <ellipse cx="800" cy="555" rx="165" ry="38" class="case"/><text x="800" y="549" class="caseText"><tspan x="800">Review and Route</tspan><tspan x="800" dy="20">Proposals</tspan></text>
  <ellipse cx="1060" cy="555" rx="180" ry="38" class="case"/><text x="1060" y="549" class="caseText"><tspan x="1060">Manage Documents</tspan><tspan x="1060" dy="20">and Supporting Files</tspan></text>

  <ellipse cx="540" cy="710" rx="175" ry="38" class="case"/><text x="540" y="704" class="caseText"><tspan x="540">Monitor Project Status</tspan><tspan x="540" dy="20">and Activities</tspan></text>
  <ellipse cx="800" cy="710" rx="175" ry="38" class="case"/><text x="800" y="704" class="caseText"><tspan x="800">Submit Accomplishment</tspan><tspan x="800" dy="20">Reports and Updates</tspan></text>
  <ellipse cx="1060" cy="710" rx="170" ry="38" class="case"/><text x="1060" y="704" class="caseText"><tspan x="1060">Receive Notifications</tspan><tspan x="1060" dy="20">and Status Updates</tspan></text>

  <ellipse cx="610" cy="865" rx="175" ry="38" class="case"/><text x="610" y="859" class="caseText"><tspan x="610">Generate Reports</tspan><tspan x="610" dy="20">and Analytics</tspan></text>
  <ellipse cx="900" cy="865" rx="155" ry="38" class="case"/><text x="900" y="859" class="caseText"><tspan x="900">Generate</tspan><tspan x="900" dy="20">Certificates</tspan></text>
  <ellipse cx="1150" cy="865" rx="130" ry="38" class="case"/><text x="1150" y="859" class="caseText"><tspan x="1150">Maintain</tspan><tspan x="1150" dy="20">Project History</tspan></text>

  <!-- Left-side actors -->
  <g class="actor">
    <g transform="translate(145 205)"><circle r="16"/><path d="M0 16v58m-31-35h62M0 74l-26 40m26-40 26 40"/></g>
    <g transform="translate(145 515)"><circle r="16"/><path d="M0 16v58m-31-35h62M0 74l-26 40m26-40 26 40"/></g>
    <g transform="translate(145 825)"><circle r="16"/><path d="M0 16v58m-31-35h62M0 74l-26 40m26-40 26 40"/></g>
  </g>
  <text x="145" y="350" class="actorText">System Administrator</text><text x="145" y="660" class="actorText">ETS Personnel</text><text x="145" y="970" class="actorText">University Administration</text>

  <!-- Right-side actors -->
  <g class="actor">
    <g transform="translate(1455 205)"><circle r="16"/><path d="M0 16v58m-31-35h62M0 74l-26 40m26-40 26 40"/></g>
    <g transform="translate(1455 515)"><circle r="16"/><path d="M0 16v58m-31-35h62M0 74l-26 40m26-40 26 40"/></g>
    <g transform="translate(1455 825)"><circle r="16"/><path d="M0 16v58m-31-35h62M0 74l-26 40m26-40 26 40"/></g>
  </g>
  <text x="1455" y="350" class="actorText">Program Leader</text><text x="1455" y="660" class="actorText">Project Leader</text><text x="1455" y="970" class="actorText">Faculty Extensionist</text>

  <!-- Associations are grouped by actor to keep the diagram readable. -->
  <g class="line">
    <path d="M165 205H625"/><path d="M165 220H625"/><path d="M165 515H355"/><path d="M165 530H365"/><path d="M165 545H365"/><path d="M165 825H435"/><path d="M165 840H435"/>
    <path d="M1435 205H975"/><path d="M1435 220H975"/><path d="M1435 515H1240"/><path d="M1435 530H1235"/><path d="M1435 825H1230"/><path d="M1435 840H1230"/>
    <path d="M355 400L625 195"/><path d="M365 555L365 555"/><path d="M365 710L365 710"/><path d="M435 865L435 865"/>
    <path d="M1235 400L1235 400"/><path d="M1235 555L1235 555"/><path d="M1235 710L1235 710"/><path d="M1235 865L1235 865"/>
    <path d="M300 515L650 400"/><path d="M300 530L635 555"/><path d="M300 545L635 710"/><path d="M300 560L745 865"/>
    <path d="M1300 205L975 400"/><path d="M1300 515L1235 555"/><path d="M1300 530L1235 710"/><path d="M1300 825L1235 710"/><path d="M1300 840L1235 555"/>
  </g>
  <text x="800" y="1065" class="note" text-anchor="middle">High-level view of the authorized users and major functions described in the study.</text>
  <text x="800" y="1092" class="subtitle" text-anchor="middle">Figure 5. Use Case Diagram of the Web-Based Project Management Hub</text>
</svg>
