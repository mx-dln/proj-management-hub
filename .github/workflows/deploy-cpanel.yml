name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Pull main on cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Add cPanel host key
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -p "${CPANEL_SSH_PORT:-22}" -H "$CPANEL_SSH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Load cPanel SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CPANEL_SSH_KEY }}

      - name: Pull and install on cPanel
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          CPANEL_APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
        run: |
          ssh -p "${CPANEL_SSH_PORT:-22}" "${CPANEL_SSH_USER}@${CPANEL_SSH_HOST}" 'bash -se' <<EOF
          set -eu
          cd "${CPANEL_APP_PATH}"
          git fetch --prune origin main
          git checkout main
          git pull --ff-only origin main

          if command -v composer >/dev/null 2>&1; then
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          elif [ -x "\${HOME}/bin/composer" ]; then
            "\${HOME}/bin/composer" install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          else
            echo "Composer was not found on cPanel. Install Composer or update this workflow."
            exit 1
          fi
          EOF
